name: Notion → Jekyll Sync

on:
  schedule:
    - cron: "0 18 * * *"  # 매일 03:00 KST 실행(= UTC 18:00)
  workflow_dispatch: {}     # 수동 실행 버튼

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 노션 → Jekyll 변환 (포스트/자산까지 처리)
      - name: Notion to Jekyll
        uses: pirafrank/notion-to-jekyll@v1
        id: notion_to_jekyll
        with:
          notion-token: ${{ secrets.NOTION_TOKEN }}
          notion-database-id: ${{ vars.NOTION_TO_JEKYLL_DATABASE_ID }}
          publish-to-posts: ${{ vars.NOTION_TO_JEKYLL_PUBLISH_TO_POSTS }} # true면 _posts/에 저장
          relative-date: ${{ vars.NOTION_TO_JEKYLL_RELATIVE_DATE }}       # 파일 날짜 산정
          site-url: "https://dev-nana1.github.io"
          assets-dir: "assets/postimages"

      # 변경사항 자동 커밋
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync posts from Notion"
